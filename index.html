<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nhân khẩu CSKV</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5cab">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#0b5cab;--ln:#e3e6ea;--wa:#b45309;--ok:#15803d;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101418;--card:#1a2027;--tx:#e8ebef;--mu:#98a2b0;--ac:#6cb0f5;--ln:#2a323b;--wa:#f0b35a;--ok:#5fd08a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101418;--card:#1a2027;--tx:#e8ebef;--mu:#98a2b0;--ac:#6cb0f5;--ln:#2a323b;--wa:#f0b35a;--ok:#5fd08a;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 12px 6px;z-index:5;border-bottom:1px solid var(--ln)}
.row{display:flex;gap:8px;align-items:center}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card)}
textarea{min-height:70px;resize:vertical}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
button.d{background:#b91c1c}
.flt{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.flt select{width:auto;min-width:120px;padding:8px}
.cnt{color:var(--mu);font-size:13px;padding:8px 14px}
.it{background:var(--card);margin:0 12px 8px;padding:10px 12px;border-radius:12px;border:1px solid var(--ln)}
.it b{display:block}.it small{color:var(--mu)}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:9px;background:var(--bg);border:1px solid var(--ln);margin-right:4px}
.tag.w{color:var(--wa);border-color:var(--wa)}.tag.o{color:var(--ok);border-color:var(--ok)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
.ov.on{display:block}
.sh{position:absolute;left:0;right:0;bottom:0;top:6%;background:var(--bg);border-radius:16px 16px 0 0;overflow:auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom,0px))}
.sh h2{margin:0 0 4px;font-size:20px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;margin:10px 0;font-size:15px}.kv span:nth-child(odd){color:var(--mu)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.mem{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)}
.lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.lock input{max-width:240px;text-align:center;font-size:22px;letter-spacing:6px}
.msg{color:var(--wa);min-height:1.2em;font-size:14px}
a.call{color:var(--ac);text-decoration:none;font-weight:600}
.br{margin:8px 0;cursor:pointer}.br div{display:flex;justify-content:space-between;font-size:14px}.br i{display:block;height:8px;border-radius:5px;background:var(--ac);margin-top:3px}.br i.w{background:var(--wa)}.br i.m{background:var(--mu)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.cd{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px}.cd b{font-size:26px;display:block}.cd small{color:var(--mu)}h3.s{margin:20px 0 2px;font-size:16px}
</style>
</head>
<body>
<div class="lock" id="lock"><h2 id="lt">Nhân khẩu CSKV</h2><div id="ls" style="color:var(--mu)"></div><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••"><button id="lb">Mở khóa</button><div class="msg" id="lm"></div></div>

<div class="top">
  <div class="row"><input id="q" type="search" placeholder="Tìm tên, mã hộ, SĐT, địa chỉ… (không cần dấu)"><button class="g" id="fb" aria-label="Lọc"></button><button class="g" id="dash">📊</button><button class="g" id="menu">☰</button></div>
  <div class="row" style="margin-top:8px"><button class="g seg" id="m1">Theo nhân khẩu</button><button class="g seg" id="m2">Theo hộ</button></div>
  <div class="flt" style="display:none"><select id="fa"><option value="">Mọi địa chỉ</option></select><select id="fc"><option value="">Mọi cư trú</option></select><select id="fr"><option value="">Mọi vai trò</option><option>Chủ hộ</option><option>Thành viên</option></select><select id="fv"><option value="">Mọi diện</option><option value="vp">Có vi phạm</option><option value="vl">Chưa có việc làm</option></select></div>
</div>
<button id="sy" style="margin:8px 12px 0;width:calc(100% - 24px)">SAO LƯU VÀ ĐỒNG BỘ</button>
<div class="cnt" id="cnt"></div>
<div id="list"></div>

<div class="ov" id="ov"><div class="sh" id="sh"></div></div>

<script>
if(typeof claude==="undefined"){window.claude={use:async()=>({save:async({filename,data})=>{const b=new Blob([data],{type:filename.endsWith(".json")?"application/json":"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}})}}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const CU=["Thường trú tại chỗ","Tạm vắng","Tạm trú","Đã chuyển đi","Đã chết","Chưa xác minh"];
const HOC=["Đang đi học","Nghỉ học","Đã học xong"];
const LV=["Sinh sống & làm việc tại địa phương","Đi địa bàn khác làm việc","Bỏ địa phương, không rõ đi đâu làm gì","Không đi làm (nội trợ, già yếu…)"];
let F=null,FN=[];
const gt=p=>p.gt||"";
const sel=(id,arr,v)=>`<select id="${id}"><option value="">—</option>${arr.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}</select>`;
const $=id=>document.getElementById(id);
let P=[],DB=null;
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase().trim();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const idb=()=>new Promise((ok,no)=>{try{const r=indexedDB.open("nk",1);r.onupgradeneeded=()=>{r.result.createObjectStore("p",{keyPath:"id",autoIncrement:true});r.result.createObjectStore("m")};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});
const tx=(s,m,f)=>new Promise((ok,no)=>{const t=DB.transaction(s,m);const r=f(t.objectStore(s));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)});
const mget=k=>tx("m","readonly",s=>s.get(k));
const mset=(k,v)=>tx("m","readwrite",s=>s.put(v,k));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("nk|"+s)))].map(b=>b.toString(16).padStart(2,"0")).join("");

// ---- khóa PIN ----
let hasPin=false;
async function initLock(){
  try{DB=await idb()}catch(e){$("lm").textContent="Trình duyệt không cho lưu dữ liệu: "+e.message;return}
  hasPin=!!(await mget("pin"));
  $("ls").textContent=hasPin?"Nhập mã PIN":"Lần đầu: đặt mã PIN (4–12 số)";
  $("lb").textContent=hasPin?"Mở khóa":"Đặt PIN";
}
$("lb").onclick=async()=>{
  const v=$("pin").value;
  if(v.length<4){$("lm").textContent="PIN tối thiểu 4 ký tự";return}
  if(!hasPin){await mset("pin",await sha(v));hasPin=true}
  else if((await sha(v))!==(await mget("pin"))){$("lm").textContent="Sai PIN";$("pin").value="";return}
  $("pin").value="";$("lm").textContent="";$("lock").style.display="none";await load();
};
$("pin").onkeydown=e=>{if(e.key==="Enter")$("lb").click()};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&hasPin){$("lock").style.display="flex";$("ls").textContent="Nhập mã PIN";$("lb").textContent="Mở khóa";$("ov").classList.remove("on")}});

// ---- dữ liệu ----
const idx=p=>{p._s=norm([p.ten,p.chu,p.ma,p.sdt,p.dc,p.vieclam,p.vipham,p.ghichu].join(" "));return p};
async function load(){P=(await tx("p","readonly",s=>s.getAll())||[]).map(idx);fillSel();render()}
function fillSel(){
  const keep=(id,arr,all)=>{const s=$(id),v=s.value;s.innerHTML=`<option value="">${all}</option>`+arr.map(x=>`<option>${esc(x)}</option>`).join("");s.value=v};
  keep("fa",[...new Set(P.map(p=>p.dc))].sort((a,b)=>a.localeCompare(b,"vi",{numeric:true})),"Mọi địa chỉ");
  keep("fc",CU,"Mọi cư trú");
}
const age=ns=>{const m=String(ns||"").match(/(\d{4})$/);return m?new Date().getFullYear()-+m[1]:null};
function render(){
  const q=norm($("q").value).split(/\s+/).filter(Boolean),a=$("fa").value,c=$("fc").value,r=$("fr").value,v=$("fv").value;
  const R=P.filter(p=>q.every(t=>p._s.includes(t))&&(!F||F.f(p))&&(!a||p.dc===a)&&(!c||(p.cutru||"")===c)&&(!r||p.vaitro===r)&&(!v||(v==="vp"?!!(p.vipham||"").trim():!(p.vieclam||"").trim())));
  $("cnt").textContent=(F?"Lọc: "+F.n+" ✕ chạm để bỏ lọc · ":"")+(P.length?`${R.length} / ${P.length} nhân khẩu`+(R.length>80?" (hiện 80 đầu, hãy lọc thêm)":""):"Chưa có dữ liệu. Bấm ☰ → Nhập file Excel.");
  $("list").innerHTML=R.slice(0,80).map(p=>`<div class="it" data-id="${p.id}"><b>${esc(p.ten)} ${p.vaitro==="Chủ hộ"?'<span class="tag o">Chủ hộ</span>':""}</b><small>${esc(p.ns||"?")}${age(p.ns)!=null?" · "+age(p.ns)+" tuổi":""} · ${esc(p.dc)} · ${esc(p.ma)}</small><div style="margin-top:4px">${p.cutru?`<span class="tag ${p.cutru==="Thường trú tại chỗ"?"o":"w"}">${esc(p.cutru)}</span>`:""}${(p.vipham||"").trim()?'<span class="tag w">Có vi phạm</span>':""}${p.vieclam?`<span class="tag">${esc(p.vieclam)}</span>`:""}</div></div>`).join("");
}
let t0;["q","fa","fc","fr","fv"].forEach(i=>$(i).oninput=()=>{clearTimeout(t0);t0=setTimeout(render,120)});
$("list").onclick=e=>{const d=e.target.closest(".it");if(d)detail(+d.dataset.id)};

// ---- chi tiết ----
const sheet=h=>{$("sh").innerHTML=h;$("ov").classList.add("on");$("sh").scrollTop=0};
const close=()=>$("ov").classList.remove("on");
$("ov").onclick=e=>{if(e.target===$("ov"))close()};
function detail(id){
  const p=P.find(x=>x.id===id);if(!p)return;
  const hh=P.filter(x=>x.ma===p.ma&&x.chu===p.chu&&x.dc===p.dc).sort((a,b)=>a.stt-b.stt);
  sheet(`<div class="row" style="justify-content:space-between"><h2>${esc(p.ten)}</h2><button class="g" onclick="close()">Đóng</button></div>
  <div class="kv"><span>Ngày sinh</span><span>${esc(p.ns||"?")}${age(p.ns)!=null?" ("+age(p.ns)+" tuổi)":""}</span><span>Vai trò</span><span>${esc(p.vaitro)} (STT ${esc(p.stt)})</span><span>Chủ hộ</span><span>${esc(p.chu)}</span><span>Mã hộ</span><span>${esc(p.ma)}</span><span>Địa chỉ HKTT</span><span>${esc(p.dc)}</span><span>Điện thoại</span><span>${p.sdt?`<a class="call" href="tel:${esc(p.sdt)}">${esc(p.sdt)}</a>`:"—"}</span></div>
  <label>Tình trạng cư trú</label><select id="e_cu"><option value="">—</option>${CU.map(x=>`<option ${x===p.cutru?"selected":""}>${x}</option>`).join("")}</select>
  <label>Giới tính${p.gt?"":" (đang tự đoán theo tên, chưa xác nhận)"}</label>${sel("e_gt",["Nam","Nữ"],gt(p))}<label>Học tập (trẻ em)</label>${sel("e_hc",HOC,p.hoc)}<label>Nơi làm việc</label>${sel("e_lv",LV,p.lv)}<label>Nghề nghiệp / nơi làm cụ thể</label><input id="e_vl" value="${esc(p.vieclam)}">
  <label>Thông tin vi phạm pháp luật</label><textarea id="e_vp">${esc(p.vipham)}</textarea>
  <label>Ghi chú</label><textarea id="e_gc">${esc(p.ghichu)}</textarea>
  <div class="row" style="margin-top:12px"><button id="sv">Lưu</button><span class="msg" id="sm"></span></div>
  <h3 style="margin:20px 0 4px">Cả hộ (${hh.length} người)</h3>${hh.map(x=>`<div class="mem" onclick="detail(${x.id})"><span>${esc(x.ten)}${x.id===id?" ◀":""}</span><small>${esc(x.vaitro)} · ${esc(x.ns||"?")}</small></div>`).join("")}`);
  $("sv").onclick=async()=>{Object.assign(p,{cutru:$("e_cu").value,gt:$("e_gt").value,hoc:$("e_hc").value,lv:$("e_lv").value,vieclam:$("e_vl").value.trim(),vipham:$("e_vp").value.trim(),ghichu:$("e_gc").value.trim(),upd:new Date().toISOString()});idx(p);
    const rec={...p};delete rec._s;try{await tx("p","readwrite",s=>s.put(rec));$("sm").textContent="Đã lưu";render()}catch(e){$("sm").textContent="Lỗi lưu: "+e.message}};
}

// ---- menu: nhập / sao lưu ----
$("menu").onclick=()=>sheet(`<div class="row" style="justify-content:space-between"><h2>Dữ liệu</h2><button class="g" onclick="close()">Đóng</button></div>
 <p style="color:var(--mu);font-size:14px">Nhập file Excel (.xlsx/.csv) cột: Mã hộ, Tên chủ hộ, STT, Tên thành viên, Vai trò, Ngày sinh, SĐT, Địa chỉ. Nhập lại file mới sẽ <b>gộp</b>: thêm người mới, cập nhật thông tin gốc, <b>giữ nguyên</b> cư trú, việc làm, vi phạm, ghi chú bạn đã nhập.</p>
 <button onclick="$('fx').click()">📥 Nhập / cập nhật từ Excel</button><input id="fx" type="file" accept=".xlsx,.xls,.csv" hidden>
 <p><button class="g" id="bk">💾 Sao lưu ra file</button> <button class="g" onclick="$('fr2').click()">♻️ Khôi phục từ sao lưu</button><input id="fr2" type="file" accept=".json" hidden></p>
 <p><button class="g" onclick="doPin()">🔑 Đổi PIN</button> <button class="d" onclick="wipe()">🗑 Xóa toàn bộ dữ liệu</button></p>
 <div class="msg" id="mm"></div>`);
const mm=t=>{const e=$("mm");if(e)e.textContent=t};
const H={ma:["ma ho","so hsct"],chu:["ten chu ho"],stt:["stt"],ten:["ten thanh vien","ho ten","ho va ten"],vaitro:["vai tro"],ns:["ngay sinh"],gt:["gioi tinh"],sdt:["so dien thoai","dien thoai","sdt"],dc:["dia chi"]};
document.addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  if(e.target.id==="fx")await importX(f);
  if(e.target.id==="fr2")await restore(f);
  e.target.value="";
});
async function importX(f){
  try{
    if(typeof XLSX==="undefined")return mm("Chưa tải được thư viện đọc Excel (cần mạng lần đầu).");
    mm("Đang đọc…");
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""});
    const hd=rows[0].map(norm),col={};
    for(const k in H)col[k]=hd.findIndex(h=>H[k].some(x=>h.includes(x)));
    if(col.ten<0||col.ma<0)return mm("Không nhận ra cột Mã hộ / Tên thành viên ở dòng đầu.");
    const g=(r,k)=>col[k]<0?"":String(r[col[k]]??"").trim();
    const key=p=>norm(p.ma)+"|"+norm(p.ten)+"|"+norm(p.ns);
    const have=new Map(P.map(p=>[key(p),p])),seen=new Set();let add=0,upd=0,dup=0;
    const batch=[];
    for(const r of rows.slice(1)){
      const n={ma:g(r,"ma"),chu:g(r,"chu"),stt:g(r,"stt"),ten:g(r,"ten"),vaitro:g(r,"vaitro")||"Thành viên",ns:g(r,"ns"),sdt:g(r,"sdt"),dc:g(r,"dc"),gt:gn(g(r,"gt"))};
      if(!n.ten)continue;const k=key(n);
      if(seen.has(k)){dup++;continue}seen.add(k);
      const o=have.get(k);
      if(o){Object.assign(o,n,{sdt:o.sdtSua?o.sdt:(n.sdt||o.sdt),gt:n.gt||o.gt});upd++;batch.push(o)}
      else{batch.push(n);add++}
    }
    const miss=P.filter(p=>!seen.has(key(p))).length;
    await tx("p","readwrite",s=>{batch.forEach(b=>{const c={...b};delete c._s;s.put(c)})});
    await load();
    mm(`Xong: thêm ${add}, cập nhật ${upd}, bỏ ${dup} dòng trùng. ${miss} người trong máy không có trong file mới (đã giữ nguyên, hãy tự kiểm tra: có thể đã chuyển đi).`);
  }catch(e){mm("Lỗi nhập: "+e.message)}
}
async function save(name,data){
  try{const d=await claude.use("downloads");if(!d)return mm("Môi trường này không hỗ trợ lưu file.");await d.save({filename:name,data});mm("Đã gửi yêu cầu lưu file.")}
  catch(e){mm(e&&e.code==="declined"?"Bạn đã hủy.":"Không lưu được: "+(e.message||e))}
}
document.addEventListener("click",e=>{if(e.target.id==="bk"){const d=P.map(p=>{const c={...p};delete c._s;return c});save("nhan-khau-sao-luu-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(d))}});
async function restore(f){
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d))throw Error("File không đúng định dạng");
    if(!confirm("Thay toàn bộ dữ liệu hiện tại bằng bản sao lưu ("+d.length+" người)?"))return;
    await tx("p","readwrite",s=>{s.clear();d.forEach(x=>{delete x.id;s.put(x)})});await load();mm("Đã khôi phục "+d.length+" người.")}
  catch(e){mm("Lỗi khôi phục: "+e.message)}
}
async function doPin(){const v=prompt("PIN mới (4–12 ký tự):");if(v&&v.length>=4&&v.length<=12){await mset("pin",await sha(v));mm("Đã đổi PIN.")}else if(v)mm("PIN không hợp lệ.")}
async function wipe(){if(confirm("Xóa TOÀN BỘ dữ liệu nhân khẩu trong máy? Không thể hoàn tác.")&&confirm("Chắc chắn xóa?")){await tx("p","readwrite",s=>s.clear());await load();mm("Đã xóa.")}}
$("dash").onclick=dashboard;
$("cnt").onclick=()=>{if(F){F=null;render()}};
document.addEventListener("click",e=>{const r=e.target.closest(".br");if(r){F=FN[+r.dataset.i];close();render();window.scrollTo(0,0)}});
function dashboard(){
 const n=P.length,hh=new Set(P.map(p=>p.ma+"|"+p.chu+"|"+p.dc)).size;FN=[];
 const R=(lab,fn,base,cl)=>{const c=P.filter(fn).length,i=FN.push({n:lab,f:fn})-1;return `<div class="br" data-i="${i}"><div><span>${esc(lab)}</span><b>${c}${base?" · "+Math.round(c*100/base)+"%":""}</b></div><i class="${cl||""}" style="width:${base?Math.max(c*100/base,c?2:0):0}%"></i></div>`};
 const ag=(a,b)=>p=>{const x=age(p.ns);return x!=null&&x>=a&&x<=b};
 const kid=ag(6,17),adult=ag(15,59),nk=P.filter(kid).length,na=P.filter(adult).length,guess=P.filter(p=>!p.gt&&gt(p)).length;
 const S=(t,h)=>`<h3 class="s">${t}</h3>${h}`;

/* ===== Bộ lọc gom một nút, lọc theo tiền tố ===== */

 if(d.vp){o.push("Vi phạm pháp luật");if(nv.tt)o.push("Tù tha về");if(nv.ta)o.push("Tiền án, tiền sự");PL.forEach(([k,l])=>{if((pl[k]||{}).on)o.push(l)})}
 if(p.hoc==="Nghỉ học")o.push("Trẻ nghỉ học");return o.map(norm)}

const DSO=[...DS3.map(x=>x[1]),"Vi phạm pháp luật","Tù tha về","Tiền án, tiền sự",...PL.map(x=>x[1]),"Trẻ nghỉ học"];
function filterUI(){
 const blk=(k,t,opts)=>`<div class="bx"><label style="margin-top:0"><b>${t}</b></label><div class="row"><input id="f_${k}" list="dl_${k}" value="${esc(FR[k])}" placeholder="Tất cả — hoặc gõ tiền tố…"><button class="g" onclick="$('f_${k}').value=''">Tất cả</button></div><datalist id="dl_${k}">${opts.map(o=>`<option value="${esc(o)}">`).join("")}</datalist></div>`;
 sheet(`<div class="row" style="justify-content:space-between"><h2>Bộ lọc</h2><button class="g" onclick="close()">Đóng</button></div>`
  +blk("dc","Địa chỉ",[...new Set(P.map(p=>p.dc))].sort((a,b)=>a.localeCompare(b,"vi",{numeric:true})))+blk("cu","Tình trạng cư trú",CU4)+blk("nn","Nghề nghiệp",NN)+blk("ds","Diện",DSO)
  +`<div class="row" style="margin-top:12px"><button id="fok">Áp dụng</button><button class="g" id="fall">Bỏ tất cả bộ lọc</button></div><p style="color:var(--mu);font-size:13px">Tiền tố: gõ phần đầu, ví dụ “tổ 1” (không cần gõ dấu). Để trống = Tất cả.</p>`)}

 for(const k in FL){FR[k]=all?"":$("f_"+k).value.trim();FL[k]=norm(FR[k])}fbadge();close();render()});

/* ===== Tìm theo nhân khẩu / theo hộ; giới tính lấy từ nguồn ===== */
const gn=s=>{const x=norm(s);return x.startsWith("nam")||x==="m"?"Nam":x.startsWith("nu")||x==="f"?"Nữ":""};
let SM=1,HK=[];
const st3=document.createElement("style");st3.textContent=".seg{flex:1;padding:8px}.seg.on{background:var(--ac);color:#fff;border-color:var(--ac)}";document.head.appendChild(st3);
function seg(){$("m1").classList.toggle("on",SM===1);$("m2").classList.toggle("on",SM===2);$("q").placeholder=SM===1?"Tìm nhân khẩu: họ tên, SĐT, ngày sinh, địa chỉ…":"Tìm hộ: tên chủ hộ, địa chỉ, mã hộ, SĐT…"}
$("m1").onclick=()=>{SM=1;seg();render()};$("m2").onclick=()=>{SM=2;seg();render()};
function render(){
 const q=norm($("q").value).split(/\s+/).filter(Boolean);
 const QQ=parseQ($("q").value);const ok=p=>(!F||F.f(p))&&(!FL.dc||norm(p.dc).startsWith(FL.dc))&&(!FL.cu||norm(p.cu).startsWith(FL.cu))&&(!FL.nn||norm(nn(p)).startsWith(FL.nn))&&(!FL.ds||dsTags(p).some(t=>t.startsWith(FL.ds)));
 const lab=F?"Lọc: "+F.n+" ✕ chạm để bỏ · ":"";
 if(SM===1){
  const R=P.filter(p=>nkMatch(p,QQ)&&ok(p)).sort((a,b)=>rank(a,QQ)-rank(b,QQ));
  $("cnt").textContent=lab+(P.length?`${R.length} / ${P.length} nhân khẩu`+(R.length>80?" (hiện 80 đầu)":""):"Chưa có dữ liệu. Bấm ☰ → Nhập file Excel.");
  $("list").innerHTML=`<div class="tw"><table><tr><th>Họ tên / Ngày sinh</th><th>Chủ hộ / Quan hệ</th><th>Địa chỉ</th></tr>`+R.slice(0,80).map(p=>`<tr data-id="${p.id}"><td><b>${esc(p.ten)}</b><br><small>${esc(p.ns||"?")}</small></td><td>${esc(p.chu)}<br><small>${esc(qh(p))}</small></td><td>${esc(p.dc)}</td></tr>`).join("")+"</table></div>";
 }else{
  const G=new Map();P.forEach(p=>{const k=hkey(p);let h=G.get(k);if(!h){h={m:[],ok:false};G.set(k,h)}h.m.push(p);if(ok(p))h.ok=true});
  const H=[...G.values()].filter(h=>{h.s=norm([h.m[0].chu,h.m[0].ma,h.m[0].dc,...h.m.map(x=>x.sdt)].join(" "));return h.ok&&hoMatch(h,QQ)});
  HK=H.slice(0,80);
  $("cnt").textContent=lab+(P.length?`${H.length} / ${G.size} hộ`+(H.length>80?" (hiện 80 đầu)":""):"Chưa có dữ liệu. Bấm ☰ → Nhập file Excel.");
  $("list").innerHTML=`<div class="tw"><table><tr><th>Chủ hộ / Địa chỉ</th><th>Khẩu</th><th>Diện trong hộ</th></tr>`+HK.map((h,i)=>{const t=[...new Set(h.m.flatMap(dsL))];if(h.m.some(x=>x.hoc==="Nghỉ học"))t.push("Nghỉ học");return`<tr data-h="${i}"><td><b>${esc(h.m[0].chu)}</b><br><small>${esc(h.m[0].dc)}</small></td><td>${h.m.length}</td><td>${t.map(x=>`<span class="tag w">${x}</span>`).join("")}</td></tr>`}).join("")+"</table></div>";
 }}
function hodetail(i){const h=HK[i];if(!h)return;const m=h.m.slice().sort((a,b)=>a.stt-b.stt);
 sheet(`<div class="row" style="justify-content:space-between"><h2>Hộ ${esc(m[0].chu)}</h2><button class="g" onclick="close()">Đóng</button></div><div class="kv"><span>Địa chỉ</span><span>${esc(m[0].dc)}</span><span>Số khẩu</span><span>${m.length}</span></div>`+m.map(x=>`<div class="mem" onclick="detail(${x.id})"><span>${esc(x.ten)}<br><small>${esc(qh(x))} · ${esc(x.ns||"?")}</small></span><span>${dsL(x).map(t=>`<span class="tag w">${t}</span>`).join("")}</span></div>`).join(""))}
$("list").onclick=e=>{const d=e.target.closest("tr[data-id]");if(d)return detail(+d.dataset.id);const h=e.target.closest("tr[data-h]");if(h)hodetail(+h.dataset.h)};

/* ===== Trang chi tiết dạng xem, nút Sửa mở form ===== */
function dsView(p){const d=p.ds||{},nv=p.nv||{},pl=p.pl||{},g=p.dsg||{},o=[];
 const kvl=a=>a.filter(x=>x[1]).map(x=>x[0]+": "+esc(x[1])).join("; "),sub=t=>`<div style="margin-left:10px">• ${t}</div>`;
 DS3.forEach(([k,l])=>{if(d[k])o.push(`<div style="margin-bottom:6px"><b>${l}</b>${g[k]?": "+esc(g[k]):""}</div>`)});
 if(d.vp){const a=[],b=[];
  if(nv.tt){const t=nv.ttd||{},x=kvl([["Ngày bắt",t.bat&&fd(t.bat)],["Bản án",t.ban],["Tội danh",t.toi],["Chấp hành xong án phạt tù",t.xong&&fd(t.xong)],["Thời gian thử thách",t.thu]]);a.push("Tù tha về"+(x?"<br><small>"+x+"</small>":""))}
  if(nv.ta){const t=nv.tad||{},x=kvl([["Hành vi vi phạm",t.hv],["Bản án / xử lý",t.xl],["Ngày xử lý",t.ngay&&fd(t.ngay)]]);a.push("Tiền án, tiền sự"+(x?"<br><small>"+x+"</small>":""))}
  if(nv.kh)a.push("Khác"+(nv.khT?": "+esc(nv.khT):""));
  PL.forEach(([k,l])=>{const x=pl[k];if(x&&x.on){const t=kvl([["Bắt đầu",x.bd&&fd(x.bd)],["Thời hạn",x.han&&x.han+" tháng"],["Kết thúc",x.kt&&fd(x.kt)],["Ghi chú",x.ghi]]);b.push(l+(x.hh?' <span class="tag w">Đã hết thời hạn</span>':"")+(t?"<br><small>"+t+"</small>":""))}});
  o.push(`<div style="margin-bottom:6px"><b>Vi phạm pháp luật</b>${a.length?"<div>Nghiệp vụ:</div>"+a.map(sub).join(""):""}${b.length?"<div>Pháp luật:</div>"+b.map(sub).join(""):""}</div>`)}
 return o.length?o.join(""):"Không"}
function detail(id){
 const p=P.find(x=>x.id===id);if(!p)return;
 const hh=P.filter(x=>hkey(x)===hkey(p)).sort((a,b)=>a.stt-b.stt),ci=CU4.indexOf(p.cu),row=(k,v)=>`<span>${k}</span><span>${v}</span>`;
 sheet(`<div class="row" style="justify-content:space-between"><h2>${esc(p.ten)}</h2><span class="row"><button id="ed">Sửa</button><button class="g" onclick="close()">Đóng</button></span></div>
 <div class="kv">${row("Họ tên",esc(p.ten))+row("Ngày sinh",esc(p.ns||"?"))+row("Giới tính",esc(gt(p)||"—"))+row("Chủ hộ",esc(p.chu))+row("Quan hệ với chủ hộ",esc(qh(p))||"—")+row("Địa chỉ thường trú",esc(p.dc))+row("Số điện thoại",p.sdt?`<a class="call" href="tel:${esc(p.sdt)}">${esc(p.sdt)}</a>`:"—")+row("Tình trạng cư trú",p.cu?CUI[ci]+" "+esc(p.cu)+(p.dcht?"<br>Nơi ở hiện tại: "+esc(p.dcht):"")+(p.cg?"<br>Ghi chú: "+esc(p.cg):""):"Chưa cập nhật")+row("Nghề nghiệp",esc(nn(p))||"—")+(p.hoc?row("Học tập",esc(p.hoc)):"")+row("Diện đặc biệt",dsView(p))}</div>
 <h3 class="s">Lịch sử cập nhật</h3>${(p.ls||[]).slice().reverse().map(h=>`<div class="hs"><b>${new Date(h.t).toLocaleString("vi-VN")}</b> · ${esc(h.n)}<br><small>Cũ: ${esc(h.a)}<br>Mới: ${esc(h.b)}</small></div>`).join("")||'<small style="color:var(--mu)">Chưa có thay đổi.</small>'}
 <h3 class="s">Cả hộ (${hh.length} người)</h3>${hh.map(x=>`<div class="mem" onclick="detail(${x.id})"><span>${esc(x.ten)}${x.id===id?" ◀":""}</span><small>${esc(qh(x))} · ${esc(x.ns||"?")}</small></div>`).join("")}`);
 $("ed").onclick=()=>detailEdit(id)}
/* ===== Tìm kiếm chính xác: khớp theo cụm từ nguyên chữ, có dấu thì khớp đúng dấu ===== */
const WC=new WeakMap();
const wd=s=>String(s||"").normalize("NFC").toLowerCase().split(/[\s,.;:\/\-]+/).filter(Boolean);
function parseQ(v){v=String(v||"").trim();return{raw:v,w:wd(v),num:/^[\d\s\/.\-]+$/.test(v),dg:v.replace(/\D/g,"")}}
function phraseIn(qw,tw){if(!qw.length)return true;
 for(let i=0;i+qw.length<=tw.length;i++){let ok=true;
  for(let j=0;j<qw.length;j++){const a=qw[j],b=tw[i+j];if(!(a===norm(a)?norm(b)===a:b===a)){ok=false;break}}
  if(ok)return true}return false}
const cw=p=>WC.get(p)||(WC.set(p,{t:wd(p.ten),d:wd(p.dc)}),WC.get(p));
function nkMatch(p,Q){if(!Q.raw)return true;
 if(Q.num)return(Q.dg.length>=3&&String(p.sdt||"").replace(/\D/g,"").includes(Q.dg))||String(p.ns||"").includes(Q.raw);
 const c=cw(p);return phraseIn(Q.w,c.t)||phraseIn(Q.w,c.d)||!!(p.dcht&&phraseIn(Q.w,wd(p.dcht)))}
function hoMatch(h,Q){if(!Q.raw)return true;const m=h.m[0];
 if(Q.num)return Q.dg.length>=3&&(String(m.ma||"").replace(/\D/g,"").includes(Q.dg)||h.m.some(x=>String(x.sdt||"").replace(/\D/g,"").includes(Q.dg)));
 return phraseIn(Q.w,wd(m.chu))||phraseIn(Q.w,wd(m.dc))}
function rank(p,Q){if(!Q.raw||Q.num)return 0;const t=cw(p).t;
 if(t.length===Q.w.length&&Q.w.every((x,i)=>x===t[i]))return 0;
 return t.slice(0,Q.w.length).every((x,i)=>x===Q.w[i])?1:2}
initLock();
