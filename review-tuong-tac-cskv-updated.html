function parseMD(text){let sec='',out=[];for(let line of String(text).replace(/^﻿/,'').split(/\r?\n/)){line=line.trim();if(/^##\s*/.test(line)){sec=line.replace(/^##\s*/,'').trim().toUpperCase();continue}if(!line.startsWith('|')||/^\|\s*-/.test(line)||/Mã hộ\s*\|/i.test(line))continue;let c=line.replace(/^\||\|$/g,'').split('|').map(x=>x.trim());if(sec==='THUONGTRU'&&c.length>=10)out.push({id:Date.now()+out.length,type:'thuongtru',ma:c[0],ten:c[1],ns:c[2],gt:c[3],qh:c[4],sdt:c[5],cccd:c[6],dc:c[7],hktt:c[7],cu:c[8]});if(['TAMTRU','LUUTRU','KHONGDUDIEUKIEN'].includes(sec))out.push({id:Date.now()+out.length,type:'khac',ma:c[0],ten:c[1],ns:c[2],gt:c[3],loai:sec==='TAMTRU'?'Tạm trú':sec==='LUUTRU'?'Lưu trú':'Không đủ điều kiện đăng ký',cccd:c[5],hktt:c[6],noio:c[7],dc:c[7]})}return out}

function downloadFile(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backupData(){let payload={version:1,savedAt:new Date().toISOString(),rows};localStorage.setItem('sotay-cskv-data',JSON.stringify(payload));downloadFile('so-tay-cskv-sao-luu-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(payload,null,2),'application/json;charset=utf-8');alert('Đã cập nhật và sao lưu dữ liệu.')}function exportExcel(){let cols=['id','type','ma','ten','ns','gt','qh','cccd','sdt','dc','hktt','noio','dcht','cu','loai','luuY','vp','vpLoai','vpNoiDung','vpChiTiet','cg'];let csv='﻿'+cols.join('\t')+'\n'+rows.map(p=>cols.map(k=>`"${String(k==='luuY'?((p[k]||[]).join('; ')):k==='vpChiTiet'?JSON.stringify(p[k]||{}):p[k]??'').replace(/"/g,'""')}"`).join('\t')).join('\n');downloadFile('so-tay-cskv-'+new Date().toISOString().slice(0,10)+'.xls',csv,'application/vnd.ms-excel;charset=utf-8');alert('Đã xuất dữ liệu để mở bằng Excel.')}function settings(){openPanel('<h2>Cài đặt</h2><div class="actions"><button id="load" class="primary">Nạp dữ liệu nguồn</button><button id="clear" class="danger">Xóa dữ liệu</button><button id="update" class="primary">Cập nhật và sao lưu</button><button id="export" class="primary">Xuất file Excel</button><button class="secondary" id="closeSet">Đóng</button></div>');$('load').onclick=()=>$('file').click();$('clear').onclick=()=>{if(confirm('Xóa dữ liệu?')){rows=[];localStorage.removeItem('sotay-cskv-data');close();render()}};$('update').onclick=backupData;$('export').onclick=exportExcel;$('closeSet').onclick=close}$('file').onchange=async()=>{let x=parseMD(await $('file').files[0].text());if(x.length){rows=x;close();render();alert('Đã nạp '+x.length+' bản ghi')}};$('settings').onclick=settings;document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{tab=x.d
